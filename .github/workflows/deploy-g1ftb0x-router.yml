name: Deploy G1ftB0x Project Router

# redeploy-after-zone-route-permission-update
on:
  push:
    branches: [main]
    paths:
      - "cloudflare/g1ftb0x-router/**"
      - ".github/workflows/deploy-g1ftb0x-router.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: cloudflare/g1ftb0x-router
        run: npm install

      - name: Build PWA assets
        working-directory: cloudflare/g1ftb0x-router
        run: npm run build:pwa

      - name: Deploy router to production Cloudflare account
        working-directory: cloudflare/g1ftb0x-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare production deploy skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 0
          fi
          npx wrangler deploy --config wrangler.jsonc
