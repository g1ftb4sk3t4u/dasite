name: Promote PerfectDay and TransportLab

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-perfectday-transportlab.yml"
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update canonical links
        run: python3 scripts/promote_perfectday_transportlab.py

      - name: Commit promoted links
        run: |
          git config user.name "g1ftb0x-site-bot"
          git config user.email "157822034+g1ftb4sk3t4u@users.noreply.github.com"
          git add index.html labs.html
          git diff --cached --quiet && exit 0
          git commit -m "Promote PerfectDay and TransportLab canonical paths"
          git push origin main
