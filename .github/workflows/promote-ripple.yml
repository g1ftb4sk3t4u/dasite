name: Promote Ripple

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-ripple.yml"
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update Ripple card
        run: python3 scripts/promote_ripple.py
      - name: Commit Ripple promotion
        run: |
          git config user.name "g1ftb0x-site-bot"
          git config user.email "157822034+g1ftb4sk3t4u@users.noreply.github.com"
          git add labs.html
          git diff --cached --quiet && exit 0
          git commit -m "Promote Ripple to Cloudflare live"
          git push origin main
