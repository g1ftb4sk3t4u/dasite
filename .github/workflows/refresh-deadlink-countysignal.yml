name: Refresh DeadLink and CountySignal

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-deadlink-countysignal.yml"
  workflow_dispatch:

jobs:
  update-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update project cards
        run: python3 scripts/refresh_project_cards.py

      - name: Commit updated Labs directory
        run: |
          git config user.name "g1ftb0x-site-bot"
          git config user.email "157822034+g1ftb4sk3t4u@users.noreply.github.com"
          git add labs.html
          git diff --cached --quiet && exit 0
          git commit -m "Add DeadLink and CountySignal to G1ft Labs"
          git push origin main
