name: Refresh canonical lab links

on:
  push:
    paths:
      - ".github/workflows/refresh-lab-links.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update SignalSafe and SkyDex cards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('labs.html')
          text = path.read_text()

          text = text.replace('iframe src="labs/signalsafe/"', 'iframe src="/signalsafe/"')
          text = text.replace('<span class="lab-status status-live">GitHub preview</span></div>\n          <div class="lab-card-content"><h2>SignalSafe</h2>', '<span class="lab-status status-live">Cloudflare live</span></div>\n          <div class="lab-card-content"><h2>SignalSafe</h2>')
          text = text.replace('href="labs/signalsafe/">Explore SignalSafe →', 'href="/signalsafe/">Explore SignalSafe →')
          text = text.replace('href="labs/signalsafe/" aria-label="Open SignalSafe"', 'href="/signalsafe/" aria-label="Open SignalSafe"')

          old = '''<div class="lab-card-top"><span class="lab-icon">✈</span><span class="lab-status status-building">Site link pending</span></div>\n          <div class="lab-card-content"><h2>SkyDex</h2><p>An aircraft-spotting collection game that turns ADS-B hunting into a giant aviation dex with rarity, families, variants and unusual mission aircraft.</p><div class="lab-tags"><span>Aviation</span><span>ADS-B</span><span>Collection</span></div><span class="lab-action muted-action">Cataloged — full site link next</span></div>\n        </article>'''
          new = '''<div class="lab-card-top"><span class="lab-icon">✈</span><span class="lab-status status-live">Cloudflare live</span></div>\n          <div class="lab-card-content"><h2>SkyDex</h2><p>An aircraft-spotting collection game that turns ADS-B hunting into a giant aviation dex with rarity, families, variants and unusual mission aircraft.</p><div class="lab-tags"><span>Aviation</span><span>ADS-B</span><span>Collection</span></div><a class="lab-action" href="/skydex/">Launch SkyDex →</a></div>\n          <a class="lab-card-link" href="/skydex/" aria-label="Open SkyDex">Open SkyDex</a>\n        </article>'''
          if old not in text:
              raise SystemExit('SkyDex card pattern not found; refusing partial edit')
          text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Commit updated directory
        run: |
          git config user.name "g1ftb0x-site-bot"
          git config user.email "157822034+g1ftb4sk3t4u@users.noreply.github.com"
          git add labs.html
          git diff --cached --quiet && exit 0
          git commit -m "Point Labs directory to canonical SignalSafe and SkyDex paths"
          git push origin main
